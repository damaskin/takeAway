services:
  postgres:
    image: postgres:16-alpine
    container_name: takeaway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: takeaway
      POSTGRES_PASSWORD: takeaway
      POSTGRES_DB: takeaway
    # Host-side port is 55432 to avoid clashing with a native Postgres
    # install on the developer's machine. The container itself still
    # listens on 5432 — keep app code connecting through DATABASE_URL.
    ports:
      - '55432:5432'
    volumes:
      - .data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U takeaway -d takeaway']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: takeaway-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - .data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO no longer publishes images to Docker Hub; quay.io is its official registry.
    image: quay.io/minio/minio:latest
    container_name: takeaway-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - .data/minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # The API uploads brand logos and product photos into this bucket and
  # serves them by public URL, but never creates it — without this step the
  # first upload in a fresh checkout failed. Idempotent; exits when done.
  minio-init:
    image: quay.io/minio/minio:latest
    container_name: takeaway-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/takeaway-dev && mc anonymous set download local/takeaway-dev"
    restart: 'no'

  mailhog:
    image: mailhog/mailhog:latest
    container_name: takeaway-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
