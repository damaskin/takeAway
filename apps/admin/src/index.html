<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>takeAway — кабинет</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48" />

    <!-- Installable as an app (Chrome/Edge/Android via the manifest; iOS
         reads the apple-* tags instead and ignores the manifest's icons). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TA Кабинет" />
    <script>
      // Telegram for the /telegram-link staff flow (not authentication —
      // staff sign in with email + password). Public values; the token stays
      // server-side. The client id (the bot's numeric id) switches to
      // Telegram Login once this origin is in the bot's Allowed URLs in
      // @BotFather; while it is empty the legacy widget uses the username.
      window.__TELEGRAM_CLIENT_ID = '';
      window.__TELEGRAM_BOT_USERNAME = 'takaway_tgbot';

      // Sentry for this SPA. The browser DSN is public by design; leave it
      // empty to disable reporting (the normal state in local dev).
      // __BUILD_VERSION is stamped by deploy/scripts/extract-spa.sh so an
      // issue points at an exact deploy.
      window.__SENTRY_DSN = '';
      window.__SENTRY_ENVIRONMENT = 'development';
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
