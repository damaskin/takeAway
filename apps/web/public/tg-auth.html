<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>takeAway</title>
    <!--
      Telegram sign-in bridge for the mobile app.

      The app opens https://oauth.telegram.org/auth?bot_id=…&return_to=<this page>
      in a secure browser session. Telegram signs the user in and redirects
      here with #tgAuthResult=<base64 JSON>; this page hands that payload back
      to the app through its takeaway:// scheme. The payload is HMAC-signed by
      Telegram and verified by the API (POST /auth/telegram/widget), so nothing
      here is trusted on its own.
    -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f8f3eb;
        color: #1a1414;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 14px 24px;
        border-radius: 14px;
        background: #c77d3b;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      p {
        color: #6b5e54;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">takeAway</h1>
      <p id="message">Возвращаемся в приложение… / Returning to the app…</p>
      <a id="open" href="takeaway://telegram-auth">Открыть takeAway / Open takeAway</a>
    </main>
    <script>
      (function () {
        var match = /(?:^|[#&?])tgAuthResult=([^&]+)/.exec(location.hash || location.search || '');
        var target = 'takeaway://telegram-auth' + (match ? '?result=' + match[1] : '?error=no_result');
        document.getElementById('open').setAttribute('href', target);
        if (!match) {
          document.getElementById('message').textContent =
            'Вход не завершён. Вернитесь в приложение и попробуйте ещё раз. / Sign-in was not completed.';
        }
        location.replace(target);
      })();
    </script>
  </body>
</html>
