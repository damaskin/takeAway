<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>web</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48" />

    <!-- Installable PWA. iOS ignores the manifest's icons and theme colour,
         hence the apple-* tags alongside it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c77d3b" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="takeAway" />
    <script>
      // Telegram Login (OpenID Connect) client id — the bot's numeric id.
      // Set it once this site's origin is in the bot's Allowed URLs
      // (@BotFather mini app → the bot → Login Widget); the page then uses
      // Telegram's current login library. Empty keeps the legacy widget below.
      window.__TELEGRAM_CLIENT_ID = '';

      // Legacy Telegram Login Widget bot username, used while the client id
      // above is empty. Leave both empty to hide Telegram. The widget only
      // works for a domain registered via BotFather's /setdomain.
      window.__TELEGRAM_BOT_USERNAME = 'takaway_tgbot';

      // Social sign-in. All three are public identifiers — the secrets stay
      // on the API. Each must also be listed in the API's
      // GOOGLE_OAUTH_CLIENT_IDS / APPLE_OAUTH_CLIENT_IDS, or the server
      // rejects the token. Leave a value empty to hide that button.
      window.__GOOGLE_CLIENT_ID = '';
      // Apple *Services ID*, not the app bundle id.
      window.__APPLE_CLIENT_ID = '';
      // Must match a Return URL registered against the Services ID.
      // Empty falls back to the current origin.
      window.__APPLE_REDIRECT_URI = '';

      // Sentry for this SPA. The browser DSN is public by design; leave it
      // empty to disable reporting (the normal state in local dev).
      // __BUILD_VERSION is stamped by deploy/scripts/extract-spa.sh so an
      // issue points at an exact deploy.
      window.__SENTRY_DSN = '';
      window.__SENTRY_ENVIRONMENT = 'development';

      // Admin panel base URL, for the "list your business" page. Deploys
      // fill it from ADMIN_APP_URL; empty means localhost:4202 in dev and
      // the admin. subdomain of this host otherwise.
      window.__ADMIN_APP_URL = '';
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
