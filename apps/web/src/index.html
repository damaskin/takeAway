<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>web</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Telegram Login Widget bot username. Leave empty to hide the widget.
      // The widget only works for a domain registered against this bot via
      // BotFather's /setdomain (e.g. `http://localhost:4200` in dev).
      window.__TELEGRAM_BOT_USERNAME = 'takaway_tgbot';

      // Social sign-in. All three are public identifiers — the secrets stay
      // on the API. Each must also be listed in the API's
      // GOOGLE_OAUTH_CLIENT_IDS / APPLE_OAUTH_CLIENT_IDS, or the server
      // rejects the token. Leave a value empty to hide that button.
      window.__GOOGLE_CLIENT_ID = '';
      // Apple *Services ID*, not the app bundle id.
      window.__APPLE_CLIENT_ID = '';
      // Must match a Return URL registered against the Services ID.
      // Empty falls back to the current origin.
      window.__APPLE_REDIRECT_URI = '';

      // Sentry for this SPA. The browser DSN is public by design; leave it
      // empty to disable reporting (the normal state in local dev).
      // __BUILD_VERSION is stamped by deploy/scripts/extract-spa.sh so an
      // issue points at an exact deploy.
      window.__SENTRY_DSN = '';
      window.__SENTRY_ENVIRONMENT = 'development';
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
