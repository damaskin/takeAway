name: takeaway_mobile
description: 'takeAway — pre-order coffee and food, skip the queue.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^17.5.0

  # Networking — models and the typed REST client live in libs/api-client-dart
  takeaway_api:
    path: ../../libs/api-client-dart
  dio: ^5.11.1
  socket_io_client: ^3.1.6

  # Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # Push — dormant until the Firebase options are passed at build time
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Sign-in
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  flutter_web_auth_2: ^5.1.0

  # Location + maps (OpenStreetMap tiles, same as the web apps)
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # UI
  cached_network_image: ^3.4.1
  google_fonts: ^8.2.1
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
