name: Deploy to production

# Production is released, not pushed to: a tag vYYYY.MM.DD on a commit that
# has already been on staging (docs/environments.md).
#
#   git fetch origin
#   git tag -a v2026.10.20 <commit> -m "Release 2026.10.20"   # usually origin/main
#   git push origin v2026.10.20
#
# (or `gh release create v2026.10.20 --target <commit> --generate-notes`).
# A second release on the same day is v2026.10.20.2. App versions (1.6.0 …)
# are tagged separately and never match this trigger.
#
# Before anything reaches the server the release is checked: the commit is on
# main, and staging has deployed it (or something built on it) successfully —
# or deployed a commit below it, and the release adds only files staging
# skips (paths-ignore in deploy-staging.yml), like the changelog PR does.
# The deploy job then waits on the `production` environment — the owner
# approves it in GitHub (repository Settings → Environments → production).

on:
  push:
    tags: ['v20[0-9][0-9].[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v2026.10.20 (a rollback is just an older tag)
        required: true
      skip_checks:
        description: Skip the "on main" and "was on staging" checks — emergencies only
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the tag
        id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch --force --tags origin
          sha="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}")" || {
            echo "::error::Tag $TAG does not exist."
            exit 1
          }
          echo "release $TAG -> $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: The commit is on main
        if: ${{ !inputs.skip_checks }}
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main. Release only what has been merged and tested; \
          for an emergency fix off main, rerun this workflow by hand with skip_checks."
            exit 1
          fi

      - name: Staging has run it
        if: ${{ !inputs.skip_checks }}
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A successful staging deploy of this commit or of a later one that
          # contains it — or of the newest one below it, when everything in
          # between is files staging does not deploy on (its paths-ignore: the
          # changelog PR before a release). Either way this code has been up on
          # test.takeaway.md. The rules: deploy/scripts/release-staging-check.sh.
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs?status=success&event=push&per_page=100" \
            --jq '.workflow_runs[].head_sha')"
          # shellcheck disable=SC2086  # one argument per SHA
          bash deploy/scripts/release-staging-check.sh "$SHA" $runs

  deploy:
    needs: verify
    uses: ./.github/workflows/deploy-to-server.yml
    with:
      environment: production
      root: /opt/takeaway
      sha: ${{ needs.verify.outputs.sha }}
      url: https://takeaway.md
      api_health_url: https://api.takeaway.md/api/health
    secrets: inherit
