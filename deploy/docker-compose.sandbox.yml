# Isolated staging stack for testing the Agroprombank integration.
#
# Deliberately NOT the production stack: its own compose project name, its own
# network, its own volumes, its own database. Nothing here is shared with
# `docker-compose.prod.yml`, so bringing this up or tearing it down cannot
# touch live orders.
#
# It also runs a *fake* bank (`agro-mock`). That is the whole point — it lets
# the flow be exercised before the bank issues merchant credentials — and it is
# exactly why this file must never be merged into the production stack.
#
# Bring up:  docker compose -f docker-compose.sandbox.yml --env-file .env.sandbox up -d --build
# Tear down: docker compose -f docker-compose.sandbox.yml --env-file .env.sandbox down -v
#
# Published to the host, loopback only: the API on ${SANDBOX_API_PORT} and the
# sandbox Web-платёж page on ${SANDBOX_WEB_BANK_PORT}.

name: takeaway-agrotest

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: takeaway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sandbox}
      POSTGRES_DB: takeaway_sandbox
    volumes:
      - sandbox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U takeaway -d takeaway_sandbox']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  agro-mock:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agro-mock
    image: takeaway/agro-mock:sandbox
    restart: unless-stopped
    environment:
      AGRO_MOCK_PORT: 8899
      AGRO_MOCK_KEY_DIR: /secrets
      # Web-платёж sandbox: notifications go to the API inside the network,
      # the customer's redirects to wherever the tester reaches the API.
      AGRO_WEB_MOCK_PORT: 8898
      AGRO_WEB_MOCK_API_BASE: http://api:3000/api
      AGRO_WEB_MOCK_PUBLIC_API_BASE: http://127.0.0.1:${SANDBOX_API_PORT:-3100}/api
      # The API container runs as a different user; these are throwaway
      # sandbox keys, so relaxing the mode is fine here and only here.
      AGRO_MOCK_KEY_MODE: shared
    ports:
      # The sandbox Web-платёж page, for a tester clicking through in a
      # browser over the same SSH tunnel as the API. Loopback only, like the
      # API below:  ssh -L 3100:127.0.0.1:3100 -L 3101:127.0.0.1:3101 <host>
      - '127.0.0.1:${SANDBOX_WEB_BANK_PORT:-3101}:8898'
    volumes:
      # Shared with the API: the mock generates the sandbox key pair here on
      # first boot, the API signs with the merchant half and verifies replies
      # against the bank half.
      - sandbox_secrets:/secrets

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: takeaway/api:sandbox
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agro-mock:
        condition: service_started
    ports:
      # Bound to loopback deliberately. Docker publishes ports straight into
      # iptables, bypassing ufw — a `3100:3000` mapping would put a gateway
      # backed by a *fake* bank on the public internet. Reach it with:
      #   ssh -L 3100:127.0.0.1:3100 <host>
      - '127.0.0.1:${SANDBOX_API_PORT:-3100}:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://takeaway:${POSTGRES_PASSWORD:-sandbox}@postgres:5432/takeaway_sandbox?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 60m
      POS_CREDENTIALS_KEY: ${POS_CREDENTIALS_KEY}
      # Agroprombank, pointed at the fake gateway.
      AGROPROMBANK_ENABLED: 'true'
      AGROPROMBANK_ENDPOINT: http://agro-mock:8899/merchant/MerchantCAPService.asmx
      AGROPROMBANK_MERCHANT_ID: M00012345
      AGROPROMBANK_TERMINAL_ID: E1016682
      AGROPROMBANK_PRIVATE_KEY_FILE: /secrets/merchant-private-key.pem
      AGROPROMBANK_BANK_CERTIFICATE_FILE: /secrets/bank-public-key.pem
      AGROPROMBANK_VERIFY_RESPONSES: 'true'
      # The sandbox has no merchant certificate and does not read <KeyInfo>.
      AGROPROMBANK_INCLUDE_KEYINFO: 'false'
      # Digits only — the bank reads invoiceid as a number.
      AGROPROMBANK_INVOICE_PREFIX: '9'
      # Web-платёж, pointed at the fake page and web service.
      AGROPROMBANK_WEB_ENABLED: 'true'
      CARD_PAYMENT_FLOW: ${SANDBOX_CARD_PAYMENT_FLOW:-token}
      AGROPROMBANK_WEB_MERCHANT_LOGIN: sandbox
      AGROPROMBANK_WEB_MERCHANT_PASS: sandbox-pass
      AGROPROMBANK_WEB_PAYMENT_URL: http://127.0.0.1:${SANDBOX_WEB_BANK_PORT:-3101}/PaymentStart
      AGROPROMBANK_WEB_SERVICE_URL: http://agro-mock:8898/merchant/APB.SV.WebPayment.AgentService.asmx
      AGROPROMBANK_WEB_BANK_CERT_FILE: /secrets/bank-public-key.pem
      AGROPROMBANK_WEB_IS_TEST: 'true'
      PUBLIC_WEB_URL: http://127.0.0.1:${SANDBOX_API_PORT:-3100}
      DELIVERY_ENABLED: 'true'
    volumes:
      - sandbox_secrets:/secrets:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  sandbox_postgres_data:
  sandbox_secrets:
