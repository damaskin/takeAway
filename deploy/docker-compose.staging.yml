# Staging only: card payments against a fake bank, so a test order on
# test.takeaway.md can be paid by card end to end without the live
# Agroprombank merchant ever seeing it. docs/environments.md.
#
# Laid over docker-compose.prod.yml when staging's deploy/.env.production
# says
#
#   EXTRA_COMPOSE_FILES=docker-compose.staging.yml
#
# (scripts/lib/env.sh; every deploy script then runs compose with it).
# Production refuses any extra compose file there, and production's
# .env.production defines neither IMAGE_TAG nor DOMAIN_API, so even a
# hand-typed `docker compose -f … -f docker-compose.staging.yml` stops on the
# `:?` below instead of starting.
#
#   agro-mock  the sandbox bank of the tests and of docker-compose.sandbox.yml
#              (tools/agroprombank-mock): bound cards (MerchantCAPService) on
#              :8899, Web-платёж on :8898. On the project network only, except
#              the payment page, which the customer's browser must open:
#              staging's nginx serves it at
#              https://<DOMAIN_API>/sandbox-bank/PaymentStart (nginx/sandbox-bank/).
#   api        every AGROPROMBANK_* setting pointed at the mock. These win over
#              deploy/.env.production, whose AGROPROMBANK_ENABLED=false is what
#              the api sees again once this file is dropped.
#
# Its key pairs are generated by the mock on first boot into a volume and
# never leave the host; its memory (bound cards, operations, invoices) is kept
# in another, so a recreated mock still knows the cards testers bound.

services:
  agro-mock:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agro-mock
    image: takeaway/agro-mock:${IMAGE_TAG:?docker-compose.staging.yml is for staging — IMAGE_TAG comes from staging's deploy/.env.production}
    # Rebuilt on every `up` (a no-op when the sources have not changed), so a
    # deploy carries changes to the sandbox like it does to the api.
    pull_policy: build
    restart: unless-stopped
    environment:
      AGRO_MOCK_PORT: 8899
      AGRO_WEB_MOCK_PORT: 8898
      AGRO_MOCK_KEY_DIR: /keys
      # The api runs as uid 10001 and reads the merchant key from the same
      # volume. Throwaway sandbox keys, so a readable private key is fine
      # here and only here.
      AGRO_MOCK_KEY_MODE: shared
      AGRO_MOCK_STATE_FILE: /state/state.json
      # The SMS code for every card binding. Testers cannot read the mock's log.
      AGRO_MOCK_OTP: '111111'
      # The notification goes to the api inside the network; the customer's
      # way back from the page goes through the public host.
      AGRO_WEB_MOCK_API_BASE: http://api:3000/${API_GLOBAL_PREFIX:-api}
      AGRO_WEB_MOCK_PUBLIC_API_BASE: https://${DOMAIN_API:?docker-compose.staging.yml is for staging — DOMAIN_API comes from staging's deploy/.env.production}/${API_GLOBAL_PREFIX:-api}
    volumes:
      - sandbox_bank_keys:/keys
      - sandbox_bank_state:/state
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8899/merchant/MerchantCAPService.asmx']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    depends_on:
      # Started, not healthy: a broken mock must not keep staging's api down.
      # The api reads the key files on every call, not once at boot.
      agro-mock:
        condition: service_started
    environment:
      # Bound cards — production's flow (CARD_PAYMENT_FLOW=token).
      AGROPROMBANK_ENABLED: 'true'
      AGROPROMBANK_ENDPOINT: http://agro-mock:8899/merchant/MerchantCAPService.asmx
      AGROPROMBANK_MERCHANT_ID: M00012345
      AGROPROMBANK_TERMINAL_ID: E1016682
      AGROPROMBANK_PRIVATE_KEY_FILE: /run/sandbox-bank/merchant-private-key.pem
      AGROPROMBANK_BANK_CERTIFICATE_FILE: /run/sandbox-bank/bank-public-key.pem
      # Inline PEMs win over the files — none may slip in from .env.production.
      AGROPROMBANK_PRIVATE_KEY: ''
      AGROPROMBANK_CERTIFICATE: ''
      AGROPROMBANK_BANK_CERTIFICATE: ''
      AGROPROMBANK_VERIFY_RESPONSES: 'true'
      # The sandbox has no merchant certificate and does not read <KeyInfo>.
      AGROPROMBANK_INCLUDE_KEYINFO: 'false'
      # Not production's 1: these invoices must never look like the bank's.
      AGROPROMBANK_INVOICE_PREFIX: '9'
      # Production's terminal takes no holds: charged when the store accepts.
      # `true` in .env.production tries the hold-and-capture flow instead.
      AGROPROMBANK_HOLD_UNTIL_ACCEPTED: ${AGROPROMBANK_HOLD_UNTIL_ACCEPTED:-false}
      # Web-платёж, for CARD_PAYMENT_FLOW=web in .env.production.
      AGROPROMBANK_WEB_ENABLED: 'true'
      CARD_PAYMENT_FLOW: ${CARD_PAYMENT_FLOW:-token}
      AGROPROMBANK_WEB_MERCHANT_LOGIN: sandbox
      AGROPROMBANK_WEB_MERCHANT_ID: ''
      AGROPROMBANK_WEB_MERCHANT_PASS: sandbox-pass
      AGROPROMBANK_WEB_PAYMENT_URL: https://${DOMAIN_API:?docker-compose.staging.yml is for staging — DOMAIN_API comes from staging's deploy/.env.production}/sandbox-bank/PaymentStart
      AGROPROMBANK_WEB_SERVICE_URL: http://agro-mock:8898/merchant/APB.SV.WebPayment.AgentService.asmx
      AGROPROMBANK_WEB_BANK_CERT: ''
      AGROPROMBANK_WEB_BANK_CERT_FILE: /run/sandbox-bank/bank-public-key.pem
      AGROPROMBANK_WEB_IS_TEST: 'true'
    volumes:
      - sandbox_bank_keys:/run/sandbox-bank:ro

  nginx:
    volumes:
      # The payment page's route. A directory, not a file: a file mount would
      # keep serving the old inode after git replaces it (see deploy.sh on
      # nginx.conf). The api vhost includes /etc/nginx/api.d/*.conf.
      - ./nginx/sandbox-bank:/etc/nginx/api.d:ro

volumes:
  sandbox_bank_keys:
  sandbox_bank_state:
