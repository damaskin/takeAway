# STAGING ONLY. Mounted into nginx at /etc/nginx/api.d/ by
# docker-compose.staging.yml and included by the api vhost; production mounts
# nothing there, so this route does not exist in production.
#
# The fake bank's Web-платёж page, which the customer's browser has to open:
#
#   https://test-api.takeaway.md/sandbox-bank/PaymentStart          the page
#   https://test-api.takeaway.md/sandbox-bank/PaymentStart/pay      its buttons
#   https://test-api.takeaway.md/sandbox-bank/PaymentStart/decline
#
# Only the page. The bank's web service (GetState, capture, refund), the
# bound-card gateway and the mock's /__sandbox/ test hooks stay on the
# project's network, where only the api calls them.
location ~ ^/sandbox-bank/(?<sandbox_bank_page>PaymentStart(/pay|/decline)?)$ {
  limit_req zone=api burst=40 nodelay;
  error_page 429 = @too_many_requests;

  # Docker's DNS, per request: with the name in a variable nginx resolves it
  # when asked rather than at start, so a missing or stopped mock answers 502
  # here instead of keeping nginx — and every staging site — from starting.
  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 5s;
  set $sandbox_bank agro-mock:8898;
  proxy_pass http://$sandbox_bank/$sandbox_bank_page$is_args$args;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $client_ip;
  proxy_set_header X-Forwarded-For $client_ip;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 30s;
}
