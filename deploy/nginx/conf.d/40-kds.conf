# The standalone kitchen app is retired: the board lives in the business
# cabinet now. Tablets bookmarked on this domain land on the cabinet's PIN
# screen, which opens the board in tablet mode.
server {
  listen 443 ssl;
  http2 on;
  server_name kds.takeaway.md;

  ssl_certificate     /etc/letsencrypt/live/takeaway.md/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/takeaway.md/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    return 301 https://admin.takeaway.md/login/pin;
  }
}
