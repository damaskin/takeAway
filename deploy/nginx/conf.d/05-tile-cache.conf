# Map tile cache: the http-level half of snippets/tiles.conf.
#
# A tile is fetched from OpenStreetMap once, then answered from here for a
# month. Kept in a named volume (tile_cache in docker-compose.prod.yml), so a
# recreated container does not send every tile back to OSM. ~15 KB a tile:
# 2 GB is well over a hundred thousand tiles, far more than our cities need;
# the least recently used go first when it fills up.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:16m
                 max_size=2g inactive=60d use_temp_path=off;
