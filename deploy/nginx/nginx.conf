user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # Gzip — Angular bundles compress ~4x, worth the CPU
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml;

  # WebSocket upgrade helper for the Socket.IO realtime gateway
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Who the visitor is. Every request reaches us through Cloudflare and then
  # the shared edge's SNI passthrough, which moves TCP bytes and adds no
  # headers — so $remote_addr is the edge container, the same for everybody.
  # Cloudflare puts the visitor's address in CF-Connecting-IP. Anything that
  # is not a bare address, or a request that skipped Cloudflare (the smoke
  # test from the host), falls back to $remote_addr. Rate limits key on this,
  # and the API is handed exactly this one address — see
  # snippets/api-proxy.conf and docs/security-hardening.md.
  map $http_cf_connecting_ip $client_ip {
    default                    $remote_addr;
    "~^[0-9A-Fa-f.:]{2,45}$"   $http_cf_connecting_ip;
  }

  # Per-visitor limits. The API keeps its own, finer limits per route and
  # per account; these stop a flood before it reaches Node at all.
  #   api   — every /api request (SPA loads fire 10–20 at once: burst 40)
  #   auth  — password and PIN sign-in, password reset, business sign-up
  #   tiles — map tiles that miss Cloudflare's cache
  # A zone of 10 MB holds state for roughly 80 000 addresses.
  limit_req_zone  $client_ip zone=api:20m   rate=20r/s;
  limit_req_zone  $client_ip zone=auth:10m  rate=10r/m;
  limit_req_zone  $client_ip zone=tiles:10m rate=30r/s;
  # Concurrent realtime connections per visitor (snippets/api-proxy.conf).
  limit_conn_zone $client_ip zone=realtime:10m;
  limit_req_status  429;
  limit_conn_status 429;
  limit_req_log_level  warn;
  limit_conn_log_level warn;

  # Slow-client protection: a connection that dribbles its headers or body,
  # or stops reading the response, is let go instead of holding a worker
  # slot. These are gaps between two reads or writes, not totals — a slow
  # phone uploading a photo keeps going as long as bytes keep moving.
  client_header_timeout 10s;
  client_body_timeout   10s;
  send_timeout          30s;

  # The largest thing anybody uploads is a 5 MB image through the API
  # (MAX_IMAGE_BYTES), plus multipart overhead. JSON bodies stop at the API's
  # own 1 MB.
  client_max_body_size 6m;

  include /etc/nginx/conf.d/*.conf;
}
