# Security headers for a site, on every response, errors included (`always`).
#
# Include it at server level AND inside every location that has an
# add_header of its own. nginx inherits add_header only into blocks that
# declare none: the Cache-Control lines in snippets/spa.conf used to drop
# every one of these from the pages themselves, so HSTS and frame protection
# reached the API's JSON but never index.html.
#
# What differs per site comes from variables each server block sets before
# including this; an empty value sends no header at all:
#   $frame_options       X-Frame-Options — DENY, or '' where we must be framed (the TMA)
#   $csp                 Content-Security-Policy, enforced
#   $csp_report_only     Content-Security-Policy-Report-Only — logged in the browser console, never blocks
#   $permissions_policy  Permissions-Policy
# and one per environment, from conf.d/01-robots.conf.template:
#   $robots_tag          X-Robots-Tag — "noindex, nofollow" on staging, none in production

# Every takeaway.md subdomain is HTTPS-only (conf.d/00-redirect.conf).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options $frame_options always;
add_header Content-Security-Policy $csp always;
add_header Content-Security-Policy-Report-Only $csp_report_only always;
add_header Permissions-Policy $permissions_policy always;
add_header X-Robots-Tag $robots_tag always;
