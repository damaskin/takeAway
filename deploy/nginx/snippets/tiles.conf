# OpenStreetMap tiles through our cache:
#   https://takeaway.md/tiles/{z}/{x}/{y}.png
#
# The apps used to ask tile.openstreetmap.org directly — every phone, over
# mobile data, for tiles whose headers often call them stale the moment they
# arrive, so phones kept asking again. Here a tile is fetched from OSM once,
# kept for 30 days (refreshed in the background after that, and served stale
# while OSM is down or throttling us), and Cloudflare caches it at the edge on
# top. Clients: the Flutter app and the shared Leaflet map (libs/ui-kit).
# See docs/map-tiles.md.
#
# Included in the takeaway.md server block only: every client uses this one
# absolute URL, so Cloudflare keeps one copy of each tile, not one per host.
# Needs the `tiles` cache zone from conf.d/05-tile-cache.conf.

location ^~ /tiles/ {
  # z 0–19 (OSM's range), numeric x and y. Nothing else is passed on.
  location ~ "^/tiles/(?<tile_z>1?[0-9])/(?<tile_x>[0-9]{1,6})/(?<tile_y>[0-9]{1,6})\.png$" {
    limit_except GET { deny all; }

    proxy_cache tiles;
    proxy_cache_key "osm/$tile_z/$tile_x/$tile_y";
    # OSM's own lifetimes are hours, and often already used up by the time a
    # tile reaches us; a map of shops and streets is fine a month old.
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 10m;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout invalid_header updating http_429 http_500 http_502 http_503 http_504;
    # Twenty phones opening the same street at once make one request to OSM.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;

    # Docker's DNS. A variable in proxy_pass makes nginx resolve the name per
    # request instead of once at start, so an unreachable OSM can never keep
    # nginx — and with it the whole site — from starting.
    resolver 127.0.0.11 valid=300s ipv6=off;
    resolver_timeout 5s;
    proxy_pass https://tile.openstreetmap.org/$tile_z/$tile_x/$tile_y.png;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name tile.openstreetmap.org;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # Ask OSM as one identifiable application, as its tile policy requires,
    # and pass nothing of the visitor's: no cookies, no tokens, no referrer.
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host tile.openstreetmap.org;
    proxy_set_header User-Agent "takeaway.md-tile-cache/1.0 (+https://takeaway.md)";
    proxy_set_header Accept "image/png";

    # OSM's caching and CDN headers describe OSM's cache, not ours. Age above
    # all: a tile that left OSM's CDN "aged" past its max-age made phones
    # treat it as stale on arrival.
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Age;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Alt-Svc;
    proxy_hide_header Via;
    proxy_hide_header X-Cache;
    proxy_hide_header X-Cache-Hits;
    proxy_hide_header X-Served-By;
    proxy_hide_header X-Timer;
    proxy_hide_header X-TileRender;

    # A week in browsers and at Cloudflare's edge (which honours it for .png
    # paths), a day of serving stale while refreshing, a month when we are
    # down. Not `always`: an error must not be cached for a week.
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400, stale-if-error=2592000";
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  return 404;
}
