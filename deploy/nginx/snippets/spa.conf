# Generic Angular SPA serving: long-cache hashed assets, no-cache index.
#
# Expects the including server block to set:
#   $spa_root — filesystem path that contains index.html + assets

# The service worker must never be cached. It is not content-hashed, so a
# year-long cache would freeze whichever version a browser first saw and no
# deploy could ever replace it — the classic way a PWA gets stuck.
location = /sw.js {
  root $spa_root;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  try_files $uri =404;
}

# The manifest is not in nginx's default mime.types, and a manifest served
# as text/plain is ignored — the install prompt silently never appears.
location = /manifest.webmanifest {
  root $spa_root;
  types { } default_type application/manifest+json;
  add_header Cache-Control "public, max-age=3600";
  try_files $uri =404;
}

# Home-screen icons are referenced by fixed names rather than content
# hashes, so an hour rather than a year: long enough to cost nothing,
# short enough that a rebrand lands the same day.
location ^~ /icons/ {
  root $spa_root;
  expires 1h;
  add_header Cache-Control "public";
  try_files $uri =404;
}

# Hashed Angular build assets are content-addressed, cache hard.
location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
  root $spa_root;
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

# index.html must always round-trip so clients pick up new deploys.
location / {
  root $spa_root;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  try_files $uri $uri/ /index.html =404;
}
