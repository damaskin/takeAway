# How a request is handed to the NestJS container. Included by every
# location that proxies to the API; timeouts stay with each location.
#
# X-Forwarded-For and X-Real-IP are *set* to the one visitor address
# ($client_ip, nginx.conf), never appended to. The API trusts exactly one
# proxy hop — this one (TRUST_PROXY, apps/api/src/app/common/http/trust-proxy.ts)
# — and takes the last address in X-Forwarded-For. Appending used to pass on
# whatever the client had typed into its own X-Forwarded-For, and the API,
# trusting the whole chain, took the first address: any client could pick
# its own IP per request and walk past every per-IP rate limit.
proxy_pass http://api:3000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $client_ip;
proxy_set_header X-Forwarded-For $client_ip;
proxy_set_header X-Forwarded-Proto https;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
