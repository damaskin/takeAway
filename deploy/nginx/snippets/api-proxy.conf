# Proxies the API on any SPA subdomain (and api.takeaway.md) to the NestJS
# container.
#
# The web / admin / tma SPAs all use a relative `/api` baseUrl so
# dev (ng serve proxy) and prod can share the same app code. This snippet
# wires that convention on prod nginx.
#
# `^~` so no regex location of the site (snippets/spa.conf caches anything
# ending in .png, .js, … as a static file) can take an API path away.
location ^~ /api/ {
  limit_req zone=api burst=40 nodelay;
  error_page 429 = @too_many_requests;
  include /etc/nginx/snippets/api-upstream.conf;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # The doors worth brute-forcing — staff password and kitchen PIN sign-in,
  # password reset, business sign-up — get a far smaller budget per visitor
  # on top of the general one (the API adds its own per-route limits behind
  # this). Customer sign-in (Telegram, Google, Apple) and token refresh stay
  # on the general budget: many customers share one carrier address.
  location ~ ^/api/(auth/(password/(login|forgot|reset)|kds/pin)|business/register)$ {
    limit_req zone=auth burst=5 nodelay;
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/api-upstream.conf;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}

# The realtime gateway. Every SPA connects to its own origin
# (`${location.origin}/ws`) and Socket.IO puts the handshake at /socket.io/,
# outside the /api prefix. Without this block the handshake fell through to
# the SPA fallback and got index.html back, so live order status, the KDS
# board and dispatch never updated on their own.
location ^~ /socket.io/ {
  # Open sockets (and long-polls) per visitor. 20, not fewer: a café's Wi-Fi
  # is one address for the kitchen tablets, the cabinet and every customer
  # with the app open. One over the limit gets 429 and its client retries;
  # the board and the menus also re-read on a timer, so nothing goes stale.
  limit_conn realtime 20;
  error_page 429 = @too_many_requests;
  include /etc/nginx/snippets/api-upstream.conf;
  proxy_buffering off;

  # A kitchen screen holds its socket for the whole shift. Socket.IO pings
  # every 25 s, so a long idle timeout only ever cuts connections that are
  # already dead.
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}

# What a visitor over a limit gets: JSON in the shape the API's own 429s
# have, so every client handles both the same way.
location @too_many_requests {
  default_type application/json;
  return 429 '{"statusCode":429,"error":"Too Many Requests","message":"Too many requests. Please wait a moment and try again."}';
}
